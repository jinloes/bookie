# Azure SQL (free offer). Activated by BOOKIE_DB_VENDOR=sqlserver. The URL must use encrypt=true;
# the password is never configured here: DatabaseConnectionPolicy reads it from the macOS Keychain
# (service com.bookie.sqlserver, account = BOOKIE_DB_USERNAME).
bookie.db.vendor=sqlserver
spring.datasource.url=${BOOKIE_DB_URL:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${BOOKIE_DB_USERNAME:}
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Separate T-SQL migrations; versions above 24 must exist in both locations.
spring.flyway.locations=classpath:db/migration-sqlserver
spring.flyway.baseline-on-migrate=false

# Hold no idle connections so the serverless database can auto-pause, and allow about a minute
# for it to resume on the next request.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=120000

# Nothing polls the database while idle.
bookie.intake.execution-mode=ON_DEMAND
bookie.auto-import.startup-only=true
bookie.auto-import.initial-delay-ms=${BOOKIE_AUTO_IMPORT_INITIAL_DELAY_MS:15000}

# Flyway owns Bookie's schema; JobRunr creates its own tables in this mode.
jobrunr.database.skip-create=false
