plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'idea'
}

group = 'com.bookie'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.flywaydb:flyway-core'
	implementation 'com.github:copilot-sdk-java:1.0.34'
	implementation 'com.microsoft.graph:microsoft-graph:6.74.0'
	implementation 'com.microsoft.azure:msal4j:1.26.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'com.h2database:h2:2.4.240'
	implementation 'com.microsoft.sqlserver:mssql-jdbc'
	implementation 'org.flywaydb:flyway-sqlserver'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.apache.commons:commons-collections4:4.6.0'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.apache.commons:commons-lang3'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.jsoup:jsoup:1.24.1'
	implementation 'net.java.dev.jna:jna:5.19.1'
	implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.2')
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-docs'
	testImplementation 'org.testcontainers:testcontainers-mssqlserver'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
}

// JDK 21+ warns on (and future JDKs block) Mockito's dynamic agent self-attach, so load it
// explicitly as a -javaagent for every test task.
tasks.withType(Test).configureEach {
	jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

// Test tiers: `test` is the fast default loop, `slowTest` holds timer/poll-driven integration
// tests (tag "slow"), `sqlServerTest` runs against a SQL Server container (tag "sqlserver", needs
// Docker), and `llmTest` is on-demand only. `check` and CI run `test` + `slowTest`; CI also runs
// `sqlServerTest`.
// The H2 tiers pin BOOKIE_DB_VENDOR because DatabaseVendorConfiguration reads it from the OS
// environment before test properties load, and Set-BookieLocalConfig.ps1 sets it for the user.
tasks.named('test') {
	environment 'BOOKIE_DB_VENDOR', 'h2'
	useJUnitPlatform {
		excludeTags 'llm', 'slow', 'sqlserver'
	}
}

tasks.register('slowTest', Test) {
	group = 'verification'
	description = 'Runs slow timer- and poll-driven integration tests (tag "slow").'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
	environment 'BOOKIE_DB_VENDOR', 'h2'
	useJUnitPlatform {
		includeTags 'slow'
		excludeTags 'llm', 'sqlserver'
	}
}

tasks.register('sqlServerTest', Test) {
	group = 'verification'
	description = 'Runs SQL Server container tests (tag "sqlserver"); requires Docker.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('slowTest')
	useJUnitPlatform {
		includeTags 'sqlserver'
		excludeTags 'llm'
	}
}

tasks.named('check') {
	dependsOn tasks.named('slowTest')
}

tasks.register('llmTest', Test) {
	group = 'verification'
	description = 'Runs on-demand LLM parsing smoke tests.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	environment 'BOOKIE_DB_VENDOR', 'h2'
	useJUnitPlatform {
		includeTags 'llm'
	}
}

spotless {
	java {
		googleJavaFormat()
	}
}

// Formatting is enforced by `spotlessCheck` in CI (see .github/workflows/ci.yml) so a PR that
// doesn't match Google Java Format fails the build instead of being silently reformatted at
// compile time. Run `./gradlew spotlessApply` locally before committing to auto-fix formatting.

// Packages the backend as a self-contained native app-image (bundled JRE, no system Java
// required) via jpackage, so the Tauri release build can ship it as a resource instead of
// shelling out to `gradlew bootRun` — which only works in dev, since a distributed app bundle
// doesn't include the backend/ Gradle project or a JDK. Only `--type app-image` is used (not
// dmg/msi/deb), since Tauri does its own installer packaging; jpackage just needs to produce a
// runnable native launcher + bundled runtime that Tauri can bundle as a resource.
//
// jpackage requires a version starting with a positive integer (macOS bundler rejects
// "0.x.y"), so this is a distribution-only version, independent of the Maven `version` above.
// Override with -PjpackageVersion=X.Y.Z from CI to match the actual release tag.
tasks.register('jpackageImage', Exec) {
	dependsOn 'bootJar'
	group = 'distribution'
	description = 'Builds a self-contained native app-image of the backend using jpackage.'

	def jpackageVersion = findProperty('jpackageVersion') ?: '1.0.0'
	def outputDir = layout.buildDirectory.dir('jpackage')
	doFirst {
		delete(outputDir.get())
	}

	def bootJarFile = tasks.named('bootJar').flatMap { it.archiveFile }
	inputs.file(bootJarFile)
	outputs.dir(outputDir)

	doFirst {
		def jarFile = bootJarFile.get().asFile
		def jpackageExe = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.parentFile.toPath()
			.resolve(org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'jpackage.exe' : 'jpackage')
			.toFile()
		commandLine jpackageExe, '--type', 'app-image',
			'--input', jarFile.parentFile,
			'--main-jar', jarFile.name,
			'--name', 'bookie-backend',
			'--app-version', jpackageVersion,
			'--dest', outputDir.get().asFile,
			'--java-options', '-Dfile.encoding=UTF-8'
	}
}
